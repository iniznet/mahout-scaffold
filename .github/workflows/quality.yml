name: Quality

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: json, hash, mysqli
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Format check
        run: composer format:check

      - name: PHPStan and architecture rules
        run: |
          composer stan
          composer arch

      - name: Psalm taint
        run: composer psalm

      - name: Rector dry-run
        run: composer rector

      - name: Divergence and artifact set
        run: composer config:check

      - name: PHPUnit
        run: composer test

      - name: Hook and translation references
        run: |
          composer hooks:check
          composer i18n:check

      - name: Doctor
        run: composer doctor
        env:
          HOWDAH_WP_ROOT: ""

  # The stub trees are compiled, resolved and gate-checked on every commit by
  # `composer test`; what only a real install can prove is that a generated tree
  # resolves over *published* refs and passes the gate set it inherits. That costs
  # minutes per combination and needs no database, so it runs nightly to catch a
  # package that shipped something its own consumers cannot use, and on a tag,
  # which is the last moment before a published ref becomes somebody's starter.
  generated-trees:
    name: Generated trees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: json, hash, mysqli
          tools: composer, node 22

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate, install and gate both hosts
        run: composer accept
